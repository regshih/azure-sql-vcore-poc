default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: gitleaks-staged
        name: Gitleaks staged changes (redacted)
        entry: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
