[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-sql-vcore-poc"
version = "0.2.0"
description = "Reproducible Azure SQL Database vCore workload evaluation with synthetic data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "click>=8.3.3,<9",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "uvicorn-worker>=0.3,<1; sys_platform != 'win32'",
    "sqlalchemy>=2.0,<3",
    "pyodbc>=5,<6",
    "azure-identity>=1.19,<2",
    "azure-storage-blob>=12.24,<13",
    "redis>=5,<7",
    "azure-monitor-opentelemetry>=1.6,<2",
    "opentelemetry-sdk>=1.29,<2",
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
    "locust>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
dev = [
    "pip>=26.2,<27",
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-PyYAML>=6,<7",
    "types-redis>=4,<5",
    "build>=1.2,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "pip-tools>=7,<8",
    "sqlfluff>=4.2,<5",
]

[project.scripts]
synthetic-business-api = "src.api.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "azure: live Azure validation requiring explicitly configured POC resources",
    "sql: live SQL Server dialect and transaction integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
